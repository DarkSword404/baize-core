# 钓鱼邮件分析 & 处置流水线模板
#
# 场景：分析可疑邮件，确认钓鱼后自动拉黑发件域

id: phishing_analysis
name: "钓鱼邮件分析 & 处置"
description: "分析可疑邮件，确认钓鱼后自动拉黑发件域并通知用户"
category: 安全运营
tags: [钓鱼, 邮件安全, 反欺诈]

trigger:
  type: manual

steps:
  - id: analyze
    type: agent
    agent: mail
    prompt: |
      分析可疑邮件是否钓鱼：
      发件：{{ context.sender }}
      收件：{{ context.recipient }}
      内容：{{ context.email_content }}
      检查发件域伪造、钓鱼特征、恶意链接、邮件头异常。
      返回 JSON：{"is_phishing": bool, "confidence": 0-1, "phishing_type": "credential/malware/..."}

  - id: decision
    type: condition
    branches:
      - when: "{{ steps.analyze.data.confidence > 0.8 }}"
        goto: auto_blacklist
      - when: "{{ steps.analyze.data.confidence > 0.5 }}"
        goto: human_confirm
      - default: true
        goto: done

  - id: auto_blacklist
    type: agent
    agent: response
    prompt: |
      确认为钓鱼，执行处置：
      恶意域名：{{ steps.analyze.data.malicious_domains }}
      加入邮件网关黑名单，通知收件人 {{ context.recipient }}。

  - id: human_confirm
    type: human
    prompt: |
      可疑邮件确认中...
      发件：{{ context.sender }}，置信度：{{ steps.analyze.data.confidence }}
      确认钓鱼请点 approve，否则 reject
    choices: [approve, reject]
    branches:
      approve: auto_blacklist
      reject: done

  - id: done
    type: end
