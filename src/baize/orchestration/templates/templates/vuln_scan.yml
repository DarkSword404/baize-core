# 漏洞扫描 & 风险评估流水线模板
#
# 场景：对目标资产执行全面漏洞扫描，AI 评估风险并给出修复优先级

id: vuln_scan
name: "漏洞扫描 & 风险评估"
description: "资产漏洞扫描 → AI 风险评估 → 修复优先级排序"
category: 安全管理
tags: [漏洞扫描, 风险评估, 漏洞管理]

trigger:
  type: manual

steps:
  - id: vuln_scan
    type: agent
    agent: general
    prompt: |
      漏洞扫描分析：
      目标：{{ context.target }}
      类型：{{ context.scan_type }}
      检查 CVE、配置缺陷、弱口令、过期服务，返回 JSON。

  - id: risk_assess
    type: agent
    agent: triage
    prompt: |
      漏洞风险评估：
      扫描结果：{{ steps.vuln_scan.result }}
      评估每个漏洞的 CVSS、可利用性、业务影响、修复优先级。返回 JSON。

  - id: remediation
    type: agent
    agent: general
    prompt: |
      生成修复方案：
      评估结果：{{ steps.risk_assess.result }}
      为每个高危漏洞提供具体修复步骤和缓解措施。

  - id: done
    type: end
