[project]
name = "baize-core"
version = "5.0.0"
description = "Baize (白泽) core — single-agent AI cybersecurity chat framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Baize Contributors" },
]
keywords = ["ai", "cybersecurity", "llm", "agent", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "openai>=1.30.0",
  "mako>=1.3.0",
  "rich>=13.0.0",
  "kuzu>=0.11.3",
  "pyyaml>=6.0",
  "jinja2>=3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint>=2.0.0",
]

[project.optional-dependencies]
streaming = ["sse-starlette>=2.0.0"]
mcp = ["mcp>=1.0.0"]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
# CI / 本地开发统一入口：pip install -e ".[dev]"
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
baize = "baize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 只声明根包，子包（api/pentest/memory/reports/orchestration/...）由
# hatchling 自动递归收集。此前逐一列子包既漏掉核心模块，又引用了已删除的
# baize.agents / baize.experiences，导致 pip install . 后导入失败。
packages = ["src/baize"]

[tool.hatch.build.targets.sdist]
include = [
  "src/baize",
]
