[project]
name = "baize-core"
version = "1.5.0"
description = "Baize (白泽) core — single-agent AI cybersecurity chat framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Baize Contributors" },
]
keywords = ["ai", "cybersecurity", "llm", "agent", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "openai>=1.30.0",
  "mako>=1.3.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
streaming = ["sse-starlette>=2.0.0"]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
baize = "baize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/baize",
  "src/baize.agents",
  "src/baize.api",
  "src/baize.experiences",
  "src/baize.receivers",
  "src/baize.sdk",
  "src/baize.tools",
  "src/baize.util",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/baize",
]
