[project]
name = "baize-core"
version = "1.2.0"
description = "Baize (白泽) core — single-agent AI cybersecurity chat framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Baize Contributors" },
]
keywords = ["ai", "cybersecurity", "llm", "agent", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "openai>=1.30.0",
  "mako>=1.3.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
streaming = ["sse-starlette>=2.0.0"]

[project.scripts]
baize = "baize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/baize",
  "src/baize.agents",
  "src/baize.api",
  "src/baize.sdk",
  "src/baize.tools",
  "src/baize.util",
  "src/baize.orchestration",
  "src/baize.orchestration.nodes",
  "src/baize.orchestration.templates",
  "src/baize.receivers",
  "src/baize.prompts",
  "src/baize.prompts.core",
  "src/baize.prompts.micro",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/baize",
  "web",
  "docs",
  "*.md",
  "*.sh",
  "LICENSE",
]
