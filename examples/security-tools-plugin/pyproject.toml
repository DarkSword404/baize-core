[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baize-security-tools-plugin"
version = "0.1.0"
description = "Baize 插件示例：演示标准 Tool 协议 + 动态注册 + 执行环境抽象"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "baize-core>=1.3.1",
]

# 关键：声明 entry point，安装后 baize 会自动发现并注册本插件的工具
[project.entry-points."baize.tools"]
security_extra = "security_tools_plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/security_tools_plugin"]
