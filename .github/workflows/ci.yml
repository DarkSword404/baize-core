# X-09: CI 测试矩阵 —— Python 3.11/3.12 × 多平台
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check (AST)
        run: |
          python -c "
          import ast, pathlib
          errors = []
          for f in pathlib.Path('src/baize').rglob('*.py'):
              try: ast.parse(f.read_text())
              except SyntaxError as e: errors.append(f'{f}: {e}')
          if errors: [print(e) for e in errors]; raise SystemExit(1)
          print('AST OK')
          "

      - name: Import check
        run: |
          python -c "import baize; print('import OK')"

      - name: Frontend build (type check + bundle)
        run: |
          cd web && npm ci && npm run build

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
